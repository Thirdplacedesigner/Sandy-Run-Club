<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandy Run Club | Find Your Crew</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Modern Dark/Sporty Theme Variables */
        :root {
            --bg-deep: #09090b; /* Pitch black/zinc */
            --bg-card: #18181b; /* Slightly lighter for cards */
            --neon-orange: #ff4d00; /* Energetic accent */
            --neon-cyan: #00f0ff; /* Secondary tech accent */
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-deep);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Typography */
        h1, h2, h3, h4, .brand-logo {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Frosted Glass Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(9, 9, 11, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 3px;
        }

        .brand-logo span {
            color: var(--neon-orange);
        }

        /* Hero Section */
        #hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            /* Fallback color if image fails */
            background-color: #111; 
            background: linear-gradient(to bottom, rgba(9, 9, 11, 0.4), rgba(9, 9, 11, 1)), 
                        url('https://images.unsplash.com/photo-1528629297340-d1d466945dc5?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat;
            background-attachment: fixed;
        }

        .hero-content {
            max-width: 1000px;
            z-index: 2;
            animation: fadeUp 1.2s ease-out forwards;
        }

        #hero h1 {
            font-size: 7vw;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #hero h1 span {
            background: linear-gradient(45deg, var(--neon-orange), #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-primary {
            display: inline-block;
            background: var(--neon-orange);
            color: #fff;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 4px; /* Squarer buttons look sportier */
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--neon-orange);
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--neon-orange);
            box-shadow: 0 0 20px rgba(255, 77, 0, 0.4);
            transform: translateY(-2px);
        }

        /* The Ritual Section */
        .section-container {
            padding: 120px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .section-header h2 {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Cool Cards */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--neon-orange);
            box-shadow: 0 15px 30px rgba(255, 77, 0, 0.15);
        }

        .card-img {
            height: 250px;
            background-color: #222; /* Fallback */
            background-size: cover;
            background-position: center;
            border-bottom: 3px solid var(--neon-orange);
        }

        /* Fresh working image links */
        .img-run { background-image: url('https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?auto=format&fit=crop&w=800&q=80'); }
        .img-beach { background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80'); }
        .img-social { background-image: url('https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&w=800&q=80'); }

        .card-body {
            padding: 30px;
        }

        .step-number {
            font-family: 'Oswald', sans-serif;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.1);
            position: absolute;
            top: 200px;
            right: 20px;
